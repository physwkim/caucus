name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # caucus is Unix-only (Unix-domain control/turn-signal sockets, a
        # PTY per panel, POSIX signals), so Windows is not a build target.
        # Both supported OSes are covered on x86_64 and arm64.
        include:
          - os: ubuntu-24.04 # linux x86_64
          - os: ubuntu-24.04-arm # linux arm64
          - os: macos-13 # macos x86_64 (Intel)
          - os: macos-15 # macos arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      # The test suite is self-contained — it does not require the
      # claude / codex agent CLIs on PATH (real-agent paths skip gracefully
      # or use /bin/sh stand-ins). Only git is needed.
      - name: Test
        run: cargo test --workspace --verbose
