[package]
name = "caucus"
version = "0.7.2"
edition = "2024"
authors = ["Sang Woo Kim"]
license = "MIT"
description = "A terminal multiplexer for teams of AI coding agents"
repository = "https://github.com/physwkim/caucus"
homepage = "https://github.com/physwkim/caucus"
readme = "README.md"
keywords = ["claude", "claude-code", "agent", "orchestrator"]
categories = ["command-line-utilities", "development-tools"]
# 1.89 stabilized std::fs::File::try_lock, used for the session single-instance
# lock (src/session/lock.rs).
rust-version = "1.89"

[[bin]]
name = "caucus"
path = "src/main.rs"

[lib]
name = "caucus"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29.0"
libc = "0.2"
once_cell = "1"
portable-pty = "0.9.0"
ratatui = "0.29.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "fs", "io-util", "io-std", "net"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
unicode-width = "=0.2.0"
vte = "0.15.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
