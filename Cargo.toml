[package]
name = "caucus"
version = "0.1.0"
edition = "2024"
authors = ["Sang Woo Kim"]
license = "MIT"
description = "Collaboration swarm orchestrator for Claude Code agents over tmux + git worktree"
repository = "https://github.com/physwkim/caucus"
homepage = "https://github.com/physwkim/caucus"
readme = "README.md"
keywords = ["claude", "claude-code", "tmux", "agent", "orchestrator"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[[bin]]
name = "caucus"
path = "src/main.rs"

[lib]
name = "caucus"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
notify = "8"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "fs", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
